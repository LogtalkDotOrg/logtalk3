<g id="node1" class="node">
<title>solve/8</title>
<g id="a_node1"><a xlink:title="Solves min 0.5*x^T*H*x + c^T*x s.t. Aeq*x = beq, Aineq*x =&lt; bineq, also returning the Lagrange multipliers Lambda at the solution: the first length(Beq) elements are the equality&#45;constraint multipliers, followed by one element per row of Aineq/Bineq (in that order), each 0.0 if that inequality is inactive at X. H must be symmetric positive semi&#45;definite over the feasible set for X to be a global minimizer. Fails (rather than raising an error) when no feasible point is found or the problem is unbounded below on the feasible set, since this predicate is meant to be used as a subroutine inside a larger iterative solver (such as sqp_active_set(_), which needs the multipliers to update its Hessian&#45;of&#45;the&#45;Lagrangian approximation and merit&#45;function penalty) that must react to that failure, not crash on it.">
