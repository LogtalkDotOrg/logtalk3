<!-- security_scheme/2 -->
<g id="node6" class="node">
<title>security_scheme/2</title>
<g id="a_node6"><a xlink:title="Maps reusable security scheme names to security descriptor terms. ``Name`` must be an atom matching scheme names referenced from operation ``security(Requirements)`` properties and ``Scheme`` must use one of the supported descriptor shapes: ``api_key/2&#45;3``, ``http/1&#45;2``, ``mutual_tls/0&#45;1``, ``oauth2/1&#45;2``, or ``openid_connect/1&#45;2``. OAuth flow descriptors are expressed using ``implicit/2&#45;3``, ``password/2&#45;3``, ``client_credentials/2&#45;3``, and ``authorization_code/3&#45;4`` with ``scope/2`` terms. ``openid_connect/2`` also accepts a provider&#45;only ``flows(Flows)`` option for local scope declarations used during security&#45;reference validation; those local flow declarations are not emitted into the derived OpenAPI document. Provider&#45;side validation checks required fields, valid ``apiKey`` locations, and URL&#45;valued fields in OAuth or OpenID Connect descriptors.">
